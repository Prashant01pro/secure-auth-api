<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Animated Auth UI</title>
  <meta name="google-client-id" content="510329503411-87v41g9mtui43md6a9bitav7gp4ii1vf.apps.googleusercontent.com">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <main class="page-shell">
    <section class="status-panel">
      <h2>Account Status</h2>
      <p id="verifyStatus" class="status-text">No verification action yet.</p>
      <div class="status-actions">
        <button id="verifyBtn" type="button" class="secondary-btn">Verify Email Token</button>
        <button id="refreshBtn" type="button" class="secondary-btn">Refresh Access Token</button>
        <button id="logoutBtn" type="button" class="secondary-btn danger-btn">Logout</button>
      </div>
      <form id="resendForm" class="inline-form">
        <input id="resendEmail" type="email" placeholder="Resend verification to email" required>
        <button type="submit">Resend Verification</button>
      </form>
      <form id="forgetForm" class="inline-form">
        <input id="forgetEmail" type="email" placeholder="Forgot password email" required>
        <button type="submit">Send Reset Link</button>
      </form>
      <form id="resetForm" class="inline-form">
        <input id="resetToken" type="text" placeholder="Reset token (or use URL token)">
        <input id="newPassword" type="password" placeholder="New password" required>
        <button type="submit">Reset Password</button>
      </form>
    </section>

    <div class="container" id="container">

    <!-- Sign Up -->
    <div class="form-container sign-up-container">
      <form id="registerForm">
        <h1>Create Account</h1>
        <input id="registerUsername" type="text" placeholder="Full Name" required>
        <input id="registerEmail" type="email" placeholder="Email" required>
        <input id="registerPassword" type="password" placeholder="Password" required>
        <button type="submit">Register</button>

        <div class="divider" aria-hidden="true"><span>or</span></div>
        <div id="googleSignUp" class="oauth-slot"></div>
      </form>
    </div>

    <!-- Sign In -->
    <div class="form-container sign-in-container">
      <form id="loginForm">
        <h1>Sign In</h1>
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">Login</button>

        <div class="divider" aria-hidden="true"><span>or</span></div>
        <div id="googleSignIn" class="oauth-slot"></div>
      </form>
    </div>
      <p id="authMessage"></p>
      <p id="oauthMessage" class="auth-helper"></p>

    <!-- Overlay -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Welcome Back!</h1>
          <p>Login to stay connected with us</p>
          <button class="ghost" id="signIn">Login</button>
        </div>
        <div class="overlay-panel overlay-right">
          <h1>Hello, Friend!</h1>
          <p>Enter your details and start your journey</p>
          <button class="ghost" id="signUp">Register</button>
        </div>
      </div>
    </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
